<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Card</title>
    <link rel="stylesheet" href="mini2.css">
</head>
<body>
    <nav class="navbar">
        <h2>Elegance Store</h2>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
            <a href="#">Cart</a>
        </div>
    </nav>
    <h1 class="heading">Our Featured Product</h1>
    <div class="product-container">
        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/615ARblI-qL._AC_UF1000,1000_QL80_.jpg" alt="Wireless Headphone"> 
            <div class="product-info">
                <span class="tag">Best Seller</span>
                <h2>Wireless Headphones</h2>
                <p class="description">Experience amazing sound quality with comfortable wireless headphones.</p>
                <p class="rating">(4.8)⭐⭐⭐⭐⭐</p>
                <h3 class="price">1,999</h3>
                <button>Add to Cart</button>

            </div>
        </div>
    </div>
    <footer>
        <p>&copy 2026 Elegance store | All Rights Reserved</p>
    </footer>
</body>
</html>
